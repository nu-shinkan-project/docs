name: Prepare ADR audit
description: Select draft ADRs whose audit state is pending.
inputs:
  result-directory:
    description: Directory for the metadata collection and audit targets.
    required: true
outputs:
  has-targets:
    description: Whether at least one ADR is eligible for this audit.
    value: ${{ steps.select.outputs.has-targets }}
runs:
  using: composite
  steps:
    - name: Collect ADR metadata before audit
      shell: bash
      env:
        RESULT_DIRECTORY: ${{ inputs.result-directory }}
      run: |
        node .agents/skills/context-discovery/scripts/collect-frontmatter.mjs \
          --docs-root . --path docs:ADR > "$RESULT_DIRECTORY/adr-audit-before.json"
    - name: Select pending draft ADRs
      id: select
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        RESULT_DIRECTORY: ${{ inputs.result-directory }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { join } = require('node:path');
          const { prepareAudit } = await import(pathToFileURL(join(process.env.ACTION_PATH, 'prepare.mjs')).href);
          await prepareAudit({ core, resultDirectory: process.env.RESULT_DIRECTORY });
